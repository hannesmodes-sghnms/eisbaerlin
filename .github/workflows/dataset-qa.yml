name: Dataset QA

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "data/raw/**"
      - "data/discovery/**"
      - ".github/workflows/dataset-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate code and committed raw data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Rebuild and audit all available raw matches
        run: |
          python scripts/audit_local_dataset.py             --raw-dir data/raw             --discovery data/discovery/season_2026_27_type_1.json             --report-dir qa-output

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-qa-${{ github.run_number }}
          path: qa-output/
          if-no-files-found: warn
          retention-days: 30
