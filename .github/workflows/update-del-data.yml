name: Update DEL 2026-27 dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: del-2026-27-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Update season data
        run: |
          python scripts/update_season.py \
            --season 2026 \
            --game-type 1 \
            --refresh-days 3 \
            --team-id 3

      - name: Validate season dataset
        run: python scripts/validate_season.py

      - name: Build EBB dashboard data
        run: |
          python scripts/generate_dashboard.py \
            --db data/del_2026_27.duckdb \
            --discovery data/discovery/season_2026_27_type_1.json \
            --output-dir site/data \
            --upcoming 3

      - name: Commit raw data, reports and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/discovery data/reports site/data
          if git diff --cached --quiet; then
            echo "No persisted data changes."
          else
            git commit -m "data: update DEL 2026-27"
            git push
          fi

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: del-2026-27-dataset-${{ github.run_number }}
          path: |
            data/del_2026_27.duckdb
            data/reports/season_quality.json
            data/reports/season_quality.md
            data/reports/season_update_summary.json
            site/
          retention-days: 30

      - name: Configure GitHub Pages
        if: ${{ vars.ENABLE_DASHBOARD_PAGES == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload dashboard for GitHub Pages
        if: ${{ vars.ENABLE_DASHBOARD_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish latest DuckDB release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dataset-2026-27-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              data/del_2026_27.duckdb \
              data/reports/season_quality.json \
              data/reports/season_quality.md \
              --clobber
          else
            gh release create "$TAG" \
              data/del_2026_27.duckdb \
              data/reports/season_quality.json \
              data/reports/season_quality.md \
              --title "DEL 2026/27 latest dataset" \
              --notes "Automatically refreshed DEL 2026/27 dataset. The assets on this release are replaced by the daily workflow."
          fi

  deploy-dashboard:
    if: ${{ vars.ENABLE_DASHBOARD_PAGES == 'true' }}
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy EBB dashboard
        id: deployment
        uses: actions/deploy-pages@v4
