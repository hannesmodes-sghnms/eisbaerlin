[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "del-event-lab"
version = "0.5.0"
description = "Automated DEL event pipeline, analytics and podcast preparation"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "duckdb>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
